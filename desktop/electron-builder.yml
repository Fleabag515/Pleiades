appId: com.pleiades.desktop
productName: Pleiades
directories:
  buildResources: build-resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The self-contained backend bundle (PyInstaller onedir build of
# pleiades.webui -- see desktop/backend-build/backend.spec / build.sh).
# Copied to <resources>/backend/ so process.resourcesPath/backend/pleiades-backend
# resolves in src/main/index.ts's bundledBackendPath(). Not `files:` because it
# lives outside the app's asar (native .so's + a launcher binary, not source).
extraResources:
  # Platform-agnostic: whichever platform's backend-build/build.{sh,ps1} ran
  # most recently is whatever's sitting in this directory when electron-
  # builder runs, so one entry covers every OS.
  - from: backend-build/dist/pleiades-backend
    to: backend
afterPack: build-resources/afterPack.cjs
win:
  executableName: pleiades-desktop
  # Explicit rather than relying on electron-builder's implicit per-platform
  # default (which today happens to also be nsis) -- keeps this file honest
  # about what actually ships instead of depending on a default that could
  # change out from under it. Code signing is NOT configured (no cert
  # available in this environment) -- an unsigned NSIS installer will trip
  # SmartScreen ("Windows protected your PC") on first run. See follow-up
  # notes for what's needed to sign it (CLAUDE.md / audit notes).
  target:
    - nsis
  # Same shape as linux: below, Windows counterpart -- see
  # anamnesis/build-native/{build,fetch-node}.ps1. Verified live on real
  # Windows 11/x64 hardware (2026-07-25).
  extraResources:
    - from: ../anamnesis/build-native/dist/node-runtime/win32-x64
      to: anamnesis-node-runtime
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build-resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Backend is bundled via extraResources above (desktop/backend-build/) so
  # the AppImage/deb need nothing pre-installed on the target machine -- see
  # src/main/index.ts's bundledBackendPath()/spawnBackend() for the runtime
  # lookup, and desktop/backend-build/build.sh to (re)produce the bundle.
  #
  # Tray icon: resources/tray-icon.png (32px, @2x at 64px) is loaded directly
  # via nativeImage in src/main/index.ts -- no electron-builder config needed
  # for it specifically, it ships as part of the app bundle like any other
  # ?asset import. Verified working on Linux Mint Cinnamon (Muffin/xapp-status
  # SNI). TODO(windows): Windows' tray convention is a smaller 16x16 icon
  # (traditionally .ico); resources/tray-icon-16.png exists and is wired up
  # conditionally in main/index.ts (see the TODO there) but is UNTESTED --
  # no Windows machine available here. Verify sizing/format looks right on
  # an actual Windows build before shipping.
  target:
    - AppImage
    - deb
  maintainer: Pleiades
  category: Utility
  # Vendored Anamnesis memory proxy, pruned to Linux x64 only (native
  # node-llama-cpp/onnxruntime-node bindings for other platforms/GPUs
  # stripped -- see anamnesis/build-native/build.sh). Copied to
  # <resources>/anamnesis/ so pleiades/anamnesis_runtime.py's anamnesis_dir()
  # resolution (via PLEIADES_ANAMNESIS_DIR, set in src/main/index.ts's
  # spawnBackend()) finds it in packaged builds.
  # The Anamnesis payload itself (source + pruned node_modules) is NOT
  # listed here as a plain extraResources entry -- electron-builder's file-
  # matching engine detects the package.json at its root and applies its own
  # "production dependency" node_modules resolution instead of a raw copy,
  # which silently drops the whole (foreign, already-pruned) node_modules/
  # tree (verified directly, including with an explicit `filter: ['**/*']`
  # override, which did not fix it -- see build-resources/afterPack.cjs's
  # own comment for the full story and matching electron-builder issues).
  # build-resources/afterPack.cjs copies it in with a plain fs operation
  # instead, after electron-builder finishes packaging everything else.
  #
  # Pinned Node runtime (see anamnesis/build-native/fetch-node.sh) so the
  # Anamnesis daemon above doesn't depend on a system-installed `node`. This
  # one has no package.json of its own (just a single `node` binary) so it
  # isn't affected by the above and copies fine as ordinary extraResources.
  # Sibling of the anamnesis/ dir afterPack.cjs produces -- see
  # anamnesis_runtime.py's _node_bin() for the sibling-path resolution.
  extraResources:
    - from: ../anamnesis/build-native/dist/node-runtime/linux-x64
      to: anamnesis-node-runtime
    # Phase 9.6 "Release N" (docs/specs/2026-07-21-native-inference-engine-
    # design.md): Pleiades' own from-scratch C++ engine is now the DEFAULT
    # inference backend whenever runtime.find_native_cpp_engine() resolves a
    # binary -- without this, a packaged app has nothing for that lookup to
    # find (it only checks a real git checkout's engine/build/ or PATH,
    # neither of which exist in an installed app) and silently falls back to
    # the old autodetected-llama-server/python chain, defeating the whole
    # cutover for every real user. Copied to <resources>/engine/ so
    # src/main/index.ts's bundledEnginePath() can find it and set
    # PLEIADES_NATIVE_CPP_ENGINE_BIN when spawning the backend -- mirrors
    # the anamnesis-node-runtime entry directly above.
    #
    # Linux-only for now, matching what's actually been built: this repo has
    # no Windows/macOS engine build yet (that's Phase 9.5, not started --
    # first-ever MSVC/AppleClang compile, tracked in the design doc as a
    # real unknown). A win:/mac: equivalent entry needs to be added once
    # those builds exist; shipping this Linux binary path unconditionally on
    # other platforms would just point PLEIADES_NATIVE_CPP_ENGINE_BIN at a
    # file that was never copied there.
    #
    # Only the single executable -- verified via `ldd` that this build has
    # zero vendored .so dependencies (statically linked llama.cpp/ggml),
    # only ordinary system libraries (libvulkan.so.1, libstdc++, libgomp,
    # libc) a real Linux desktop is expected to already have. A machine with
    # literally no Vulkan loader installed at all would fail to launch this
    # binary (a hard dynamic-link failure, not a graceful CPU fallback) --
    # a real, currently-unmitigated risk, matching the design doc's own R5
    # ("ship CPU+Vulkan in the installer" was the eventual plan, not yet
    # built); not solved in this pass, flagged honestly rather than ignored.
    - from: ../engine/build/pleiades-engine-server
      to: engine/pleiades-engine-server
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# electron-updater checks this repo's GitHub Releases for a newer published
# version than package.json's own -- see src/main/index.ts's auto-updater
# wiring. Release artifacts must include the per-platform files
# electron-builder already produces here (the .deb/.AppImage/.exe/.dmg) PLUS
# the latest*.yml files electron-builder generates alongside them (that's
# what electron-updater actually reads to know a new version exists and
# where to fetch it) -- `electron-builder --publish always` (or uploading
# dist/'s full contents to a GitHub Release by hand) covers both.
publish:
  provider: github
  owner: Fleabag515
  repo: Pleiades
