# Builds the from-scratch Pleiades engine (engine/) per platform/backend and
# uploads the binaries as workflow artifacts.
#
# Scope (2026-09-05, owner decision): LINUX ONLY. Windows and macOS support
# is dropped — the hardware matrix is the point: NVIDIA (CUDA), AMD (ROCm/HIP,
# consumer gfx1100/gfx1151/gfx1201), Vulkan (the universal fallback: NVIDIA,
# AMD, Intel), and CPU. Tag pushes attach
# `pleiades-engine-<os>-<backend>` binaries to the GitHub Release — exactly
# the names runtime.install_engine_asset() resolves, so end users get
# prebuilt engines without a compiler. All four backends were exercised on
# real hardware locally or on the runner (CUDA + Vulkan on the RTX 2080 Ti,
# AMD's own RX 9070 XT via Vulkan per PLEIADES-WINDOWS-AMD-RESULTS.md).
name: engine-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, hip, vulkan, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc spirv-headers
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        # The distro-packaged nvcc (CUDA 12.0 on the runner image) is enough
        # -- we only COMPILE in CI, no GPU. Architectures pinned to what
        # CUDA 12.0 targets: Turing (75) through Hopper (90). Blackwell
        # (sm_100/120) needs a >= 12.8 toolkit -- follow-up once a reliable
        # pinned-toolkit source is settled; both jimver/cuda-toolkit
        # versions tried (12.6.3, 12.8.1) were rejected by its manifest.
        run: sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
      - name: Configure
        run: |
          if [ "${{ matrix.backend }}" = "cuda" ]; then FLAGS="-DPLEIADES_ENGINE_BACKEND=cuda -DPLEIADES_ENGINE_CUDA_ARCHITECTURES=75;80;86;89;90"; fi
          if [ "${{ matrix.backend }}" = "vulkan" ]; then FLAGS="-DPLEIADES_ENGINE_BACKEND=vulkan"; fi
          if [ "${{ matrix.backend }}" = "cpu" ]; then FLAGS="-DPLEIADES_ENGINE_BACKEND=cpu"; fi
          cmake -S engine -B engine/build-ci $FLAGS -DCMAKE_BUILD_TYPE=Release
      - name: Build
        # -j2 bounded: unbounded parallelism gets the build SIGTERM'd on the
        # 2-core runner (observed: exit 143 on the first dispatch run).
        run: cmake --build engine/build-ci --target pleiades-engine-server -j2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-engine-linux-${{ matrix.backend }}
          path: engine/build-ci/pleiades-engine-server

  release:
    # Tag pushes: attach the built engine binaries to the tag's GitHub
    # Release (created if absent) as the assets install_engine_asset()
    # fetches. Release creation needs write permission.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [linux]
    permissions:
      contents: write
    steps:
      # gh resolves the repo from the checkout -- without this,
      # `gh release create` dies with "not a git repository" (observed on the
      # v0.1.5 first run; the binaries themselves had built fine).
      - uses: actions/checkout@v4
      - name: Download all engine artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # NO merge-multiple: all three Linux binaries share the filename
          # `pleiades-engine-server` and would overwrite each other — each
          # artifact lands in its own subdirectory named after the artifact.
      - name: Rename binaries to their asset names
        run: |
          mkdir -p out
          cp artifacts/pleiades-engine-linux-cuda/pleiades-engine-server out/pleiades-engine-linux-cuda
          cp artifacts/pleiades-engine-linux-hip/pleiades-engine-server out/pleiades-engine-linux-hip
          cp artifacts/pleiades-engine-linux-vulkan/pleiades-engine-server out/pleiades-engine-linux-vulkan
          cp artifacts/pleiades-engine-linux-cpu/pleiades-engine-server out/pleiades-engine-linux-cpu
          ls -la out/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" out/pleiades-engine-linux-* --clobber
