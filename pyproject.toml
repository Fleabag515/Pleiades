[project]
name = "pleiades"
version = "0.1.0"
description = "A self-contained inference workstation for LLM agents — Pleiades runs the model itself (in-process llama.cpp), with memory via Anamnesis and built-in web search, browser control, email, a password vault, and Discord hosting. One profile per Anamnesis character."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fleabag515" }]

dependencies = [
    "llama-cpp-python[server]>=0.3",  # OUR inference engine: loads GGUF, serves an OpenAI-compatible endpoint in-process
    "openai>=1.30",                   # client to the Anamnesis character proxy (OpenAI-compatible)
    "httpx>=0.27",                    # Anamnesis control API + SearXNG
    "click>=8.1",                     # CLI
    "rich>=13.7",                     # pretty CLI / chat REPL
    "cryptography>=42.0",             # vault encryption (Fernet)
    "platformdirs>=4.2",              # cross-platform config paths
    "psutil>=5.9",                    # harness/sandbox.py: cross-platform memory watchdog for run_shell/run_python
    "PyYAML>=6.0",                    # searxng_runtime.py reads/writes services/searxng/settings.yml
]

[project.optional-dependencies]
browser = ["camoufox[geoip]>=0.5.4"]   # headed anti-fingerprint Firefox + Playwright
discord = ["discord.py>=2.4"]
# Workspace harness (pleiades.harness): optional cloud tiers for the agent loop.
# Local llama.cpp inference (core) remains the primary backend; these only enable
# calling hosted models (Anthropic API) as additional tiers. Document readers are optional too.
workspace = ["anthropic>=0.69"]
docs = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "Pillow>=10.0"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "python-multipart>=0.0.9"]   # `pleiades ui` control panel; python-multipart is required by FastAPI for the attachment-upload endpoint's UploadFile/File
# desktop app right-panel "browser view": a live, embeddable Chromium session
# via CDP screencast — separate from the `browser` extra above (Camoufox),
# see pleiades/webui/browser_view.py
browser-view = ["playwright>=1.40"]
all = ["camoufox[geoip]>=0.5.4", "discord.py>=2.4", "anthropic>=0.69", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "playwright>=1.40", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
pleiades = "pleiades.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pleiades"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# third_party/llama.cpp is a vendored upstream submodule -- not our code, never lint it.
exclude = ["third_party"]

[tool.ruff.lint]
# Pinned to ruff's classic correctness-only set (syntax errors, pyflakes, a few
# pycodestyle checks) rather than leaving `select` unset. An unset `select` means
# "whatever ruff considers its default recommended set this release" -- that set
# has grown release over release (style/modernization/opinionated categories),
# so CI silently started failing on hundreds of pre-existing style findings with
# no code change and no warning. Correctness bugs belong in CI; style opinions
# are a separate, deliberate cleanup project if ever wanted.
select = ["E4", "E7", "E9", "F"]
