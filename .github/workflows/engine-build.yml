# Builds the from-scratch Pleiades engine (engine/) per platform/backend and
# uploads the binaries as workflow artifacts.
#
# Status (2026-08-30): artifacts are NOT yet wired into a GitHub Release (the
# project has zero releases), so `pleiades runtime install` does not fetch
# them yet — `pleiades runtime build-engine` (local compile) is the delivery
# path until the first release is cut. HIP/ROCm is deferred until a
# ROCm-capable runner/machine is available (no AMD build verified anywhere
# yet). The Linux CUDA and Linux Vulkan builds were exercised on real
# hardware locally (RTX 2080 Ti); the Windows job has not had a run yet —
# expect first-run churn.
name: engine-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc spirv-headers
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        # The distro-packaged nvcc is enough -- we only COMPILE in CI (no GPU
        # on the runner); architectures are pinned explicitly so "native"
        # autodetection can't pick the runner's (absent) GPU.
        run: sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
      - name: Configure
        run: |
          FLAGS="-DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=OFF"
          if [ "${{ matrix.backend }}" = "cuda" ]; then FLAGS="-DPLEIADES_ENGINE_CUDA=ON -DPLEIADES_ENGINE_VULKAN=OFF -DPLEIADES_ENGINE_CUDA_ARCHITECTURES=75;80;86;89;90"; fi
          if [ "${{ matrix.backend }}" = "vulkan" ]; then FLAGS="-DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=ON"; fi
          cmake -S engine -B engine/build-ci $FLAGS -DCMAKE_BUILD_TYPE=Release
      - name: Build
        # -j2 bounded: unbounded parallelism gets the build SIGTERM'd on the
        # 2-core runner (observed: exit 143 on the first dispatch run).
        run: cmake --build engine/build-ci --target pleiades-engine-server -j2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-engine-linux-${{ matrix.backend }}
          path: engine/build-ci/pleiades-engine-server

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Vulkan SDK
        # First-party chocolatey package rather than a third-party action
        # (the one this workflow originally guessed at does not exist).
        run: choco install vulkan-sdk -y --no-progress
      - name: Configure
        run: cmake -S engine -B engine/build-ci -DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build engine/build-ci --target pleiades-engine-server --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-engine-windows-vulkan
          path: engine/build-ci/Release/pleiades-engine-server.exe
