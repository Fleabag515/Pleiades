name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux-only by scope decision (2026-09-05): Windows and macOS are
        # dropped; hardware breadth is the engine-build workflow's job.
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # llama-cpp-python builds from source and isn't needed by the test suite;
      # install the lightweight deps directly, then the package itself with
      # --no-deps so `import pleiades` resolves without building llama-cpp-python.
      - name: Install test dependencies
        run: |
          pip install pytest ruff click rich httpx openai cryptography platformdirs fastapi uvicorn pyyaml python-multipart psutil
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -q
