# Builds the from-scratch Pleiades engine (engine/) per platform/backend and
# uploads the binaries as workflow artifacts.
#
# Status (2026-09-05): the build matrix is green end-to-end (verified via
# workflow_dispatch: linux cuda/vulkan/cpu + windows vulkan). Tag pushes add
# the four binaries to the GitHub Release as `pleiades-engine-<os>-<backend>`
# assets — exactly the names runtime.install_engine_asset() resolves, so
# end users get prebuilt engines without a compiler. HIP/ROCm is deferred
# until a ROCm-capable runner/machine is available.
name: engine-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslc spirv-headers
      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        # The distro-packaged nvcc is enough -- we only COMPILE in CI (no GPU
        # on the runner); architectures are pinned explicitly so "native"
        # autodetection can't pick the runner's (absent) GPU.
        run: sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
      - name: Configure
        run: |
          FLAGS="-DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=OFF"
          if [ "${{ matrix.backend }}" = "cuda" ]; then FLAGS="-DPLEIADES_ENGINE_CUDA=ON -DPLEIADES_ENGINE_VULKAN=OFF -DPLEIADES_ENGINE_CUDA_ARCHITECTURES=75;80;86;89;90"; fi
          if [ "${{ matrix.backend }}" = "vulkan" ]; then FLAGS="-DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=ON"; fi
          cmake -S engine -B engine/build-ci $FLAGS -DCMAKE_BUILD_TYPE=Release
      - name: Build
        # -j2 bounded: unbounded parallelism gets the build SIGTERM'd on the
        # 2-core runner (observed: exit 143 on the first dispatch run).
        run: cmake --build engine/build-ci --target pleiades-engine-server -j2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-engine-linux-${{ matrix.backend }}
          path: engine/build-ci/pleiades-engine-server

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Vulkan SDK
        # First-party chocolatey package rather than a third-party action
        # (the one this workflow originally guessed at does not exist).
        run: choco install vulkan-sdk -y --no-progress
      - name: Configure
        run: cmake -S engine -B engine/build-ci -DPLEIADES_ENGINE_CUDA=OFF -DPLEIADES_ENGINE_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build engine/build-ci --target pleiades-engine-server --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-engine-windows-vulkan
          path: engine/build-ci/Release/pleiades-engine-server.exe

  release:
    # Tag pushes: attach the built engine binaries to the tag's GitHub
    # Release (created if absent) as the assets install_engine_asset()
    # fetches. Release creation needs write permission.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      # gh resolves the repo from the checkout -- without this,
      # `gh release create` dies with "not a git repository" (observed on the
      # v0.1.5 first run; the binaries themselves had built fine).
      - uses: actions/checkout@v4
      - name: Download all engine artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # NO merge-multiple: all three Linux binaries share the filename
          # `pleiades-engine-server` and would overwrite each other — each
          # artifact lands in its own subdirectory named after the artifact.
      - name: Rename binaries to their asset names
        run: |
          mkdir -p out
          cp artifacts/pleiades-engine-linux-cuda/pleiades-engine-server out/pleiades-engine-linux-cuda
          cp artifacts/pleiades-engine-linux-vulkan/pleiades-engine-server out/pleiades-engine-linux-vulkan
          cp artifacts/pleiades-engine-linux-cpu/pleiades-engine-server out/pleiades-engine-linux-cpu
          cp artifacts/pleiades-engine-windows-vulkan/pleiades-engine-server.exe out/pleiades-engine-windows-vulkan.exe
          ls -la out/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" out/pleiades-engine-* --clobber
