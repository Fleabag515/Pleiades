appId: com.pleiades.desktop
productName: Pleiades
directories:
  buildResources: build-resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# The self-contained backend bundle (PyInstaller onedir build of
# pleiades.webui -- see desktop/backend-build/backend.spec / build.sh).
# Copied to <resources>/backend/ so process.resourcesPath/backend/pleiades-backend
# resolves in src/main/index.ts's bundledBackendPath(). Not `files:` because it
# lives outside the app's asar (native .so's + a launcher binary, not source).
extraResources:
  - from: backend-build/dist/pleiades-backend
    to: backend
  # Vendored Anamnesis memory proxy, pruned to Linux x64 only (native
  # node-llama-cpp/onnxruntime-node bindings for other platforms/GPUs
  # stripped -- see anamnesis/build-native/build.sh). Copied to
  # <resources>/anamnesis/ so pleiades/anamnesis_runtime.py's anamnesis_dir()
  # resolution (via PLEIADES_ANAMNESIS_DIR, set in src/main/index.ts's
  # spawnBackend()) finds it in packaged builds. TODO(windows/mac): build.sh
  # is Linux x64-only today; this entry needs a per-platform equivalent
  # before those targets can bundle Anamnesis at all.
  - from: ../anamnesis/build-native/dist/anamnesis
    to: anamnesis
  # Pinned Node runtime (see anamnesis/build-native/fetch-node.sh) so the
  # bundled Anamnesis daemon above doesn't depend on a system-installed
  # `node`. Sibling of the anamnesis/ entry above -- see
  # anamnesis_runtime.py's _node_bin() for the sibling-path resolution.
  - from: ../anamnesis/build-native/dist/node-runtime/linux-x64
    to: anamnesis-node-runtime
win:
  executableName: pleiades-desktop
  # Explicit rather than relying on electron-builder's implicit per-platform
  # default (which today happens to also be nsis) -- keeps this file honest
  # about what actually ships instead of depending on a default that could
  # change out from under it. Code signing is NOT configured (no cert
  # available in this environment) -- an unsigned NSIS installer will trip
  # SmartScreen ("Windows protected your PC") on first run. See follow-up
  # notes for what's needed to sign it (CLAUDE.md / audit notes).
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build-resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # Backend is bundled via extraResources above (desktop/backend-build/) so
  # the AppImage/deb need nothing pre-installed on the target machine -- see
  # src/main/index.ts's bundledBackendPath()/spawnBackend() for the runtime
  # lookup, and desktop/backend-build/build.sh to (re)produce the bundle.
  #
  # Tray icon: resources/tray-icon.png (32px, @2x at 64px) is loaded directly
  # via nativeImage in src/main/index.ts -- no electron-builder config needed
  # for it specifically, it ships as part of the app bundle like any other
  # ?asset import. Verified working on Linux Mint Cinnamon (Muffin/xapp-status
  # SNI). TODO(windows): Windows' tray convention is a smaller 16x16 icon
  # (traditionally .ico); resources/tray-icon-16.png exists and is wired up
  # conditionally in main/index.ts (see the TODO there) but is UNTESTED --
  # no Windows machine available here. Verify sizing/format looks right on
  # an actual Windows build before shipping.
  target:
    - AppImage
    - deb
  maintainer: Pleiades
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# electron-updater checks this repo's GitHub Releases for a newer published
# version than package.json's own -- see src/main/index.ts's auto-updater
# wiring. Release artifacts must include the per-platform files
# electron-builder already produces here (the .deb/.AppImage/.exe/.dmg) PLUS
# the latest*.yml files electron-builder generates alongside them (that's
# what electron-updater actually reads to know a new version exists and
# where to fetch it) -- `electron-builder --publish always` (or uploading
# dist/'s full contents to a GitHub Release by hand) covers both.
publish:
  provider: github
  owner: Fleabag515
  repo: Pleiades
