<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pleiades · Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div id="app">
  <!-- ─────────────── Sidebar ─────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="currentColor">
          <circle cx="24" cy="9" r="3.4"/>
          <circle cx="13" cy="16" r="2.6"/>
          <circle cx="34" cy="15" r="2.9"/>
          <circle cx="9"  cy="29" r="2.2"/>
          <circle cx="20" cy="27" r="3.1"/>
          <circle cx="33" cy="30" r="2.4"/>
          <circle cx="27" cy="40" r="2.0"/>
        </g>
        <g stroke="currentColor" stroke-width="0.8" opacity="0.35" fill="none">
          <path d="M24 9 L34 15 L33 30 L20 27 L13 16 Z"/>
          <path d="M20 27 L9 29 M33 30 L27 40"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Pleiades</span>
        <span class="brand-sub">control panel</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <span class="nav-ico">◎</span><span>Overview</span>
      </button>
      <button class="nav-item" data-view="characters">
        <span class="nav-ico">✶</span><span>Characters</span>
      </button>
      <button class="nav-item" data-view="models">
        <span class="nav-ico">▤</span><span>Models</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-ico">⚙</span><span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="svc-mini" id="svc-mini"></div>
      <div class="foot-meta">v1.0 · local only</div>
    </div>
  </aside>

  <!-- ─────────────── Main ─────────────── -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Overview</h1>
        <p id="view-sub" class="view-sub"></p>
      </div>
      <div class="topbar-actions">
        <span id="update-host"></span>
        <button class="btn ghost" id="refresh-btn" title="Reload state">⟳ Refresh</button>
      </div>
    </header>

    <section class="content" id="content"><!-- views render here --></section>
  </main>
</div>

<!-- ─────────────── Modal host ─────────────── -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="modal-x" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- ─────────────── Toast host ─────────────── -->
<div class="toast-host" id="toast-host"></div>

<script src="/static/app.js"></script>
</body>
</html>
