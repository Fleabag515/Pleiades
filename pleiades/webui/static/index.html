<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Pleiades</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div id="app">
  <!-- ─────────────── Sidebar ─────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="starg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9aa8ff"/><stop offset="1" stop-color="#5ce1e6"/>
          </linearGradient>
        </defs>
        <g fill="url(#starg)">
          <circle cx="24" cy="9" r="3.4"/><circle cx="13" cy="16" r="2.6"/>
          <circle cx="34" cy="15" r="2.9"/><circle cx="9" cy="29" r="2.2"/>
          <circle cx="20" cy="27" r="3.1"/><circle cx="33" cy="30" r="2.4"/>
          <circle cx="27" cy="40" r="2.0"/>
        </g>
        <g stroke="url(#starg)" stroke-width="0.8" opacity="0.35" fill="none">
          <path d="M24 9 L34 15 L33 30 L20 27 L13 16 Z"/>
          <path d="M20 27 L9 29 M33 30 L27 40"/>
        </g>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Pleiades</span>
        <span class="brand-sub">Inference Workstation</span>
      </div>
    </div>

    <div class="nav-group-label">Workspace</div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-item" data-view="chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7V9zm6 5H7v-2h6v2zm4-6H7V6h10v2z"/></svg>
        <span>Chat</span>
      </button>
      <button class="nav-item" data-view="work">
        <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span>Agent</span>
      </button>
    </nav>

    <div class="nav-group-label">Manage</div>
    <nav class="nav">
      <button class="nav-item" data-view="characters">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/></svg>
        <span>Characters</span>
      </button>
      <button class="nav-item" data-view="models">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h16v4H4v-4z"/></svg>
        <span>Models</span>
      </button>
      <button class="nav-item" data-view="hardware">
        <svg viewBox="0 0 24 24"><path d="M9 2v2H7a3 3 0 0 0-3 3v2H2v2h2v2H2v2h2v2a3 3 0 0 0 3 3h2v2h2v-2h2v2h2v-2h2a3 3 0 0 0 3-3v-2h2v-2h-2v-2h2V9h-2V7a3 3 0 0 0-3-3h-2V2h-2v2h-2V2H9zm-2 5h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm2 3v4h6v-4H9z"/></svg>
        <span>Hardware</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l2.1-1.7a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.5 11a7.6 7.6 0 0 0-.1 1 7.6 7.6 0 0 0 .1 1l-2.1 1.7a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.2 0 .4-.2.5-.4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="svc-mini" id="svc-mini"></div>
      <div class="foot-meta"><span class="dot up" style="margin-right:6px"></span>127.0.0.1 · local only</div>
    </div>
  </aside>

  <!-- ─────────────── Main ─────────────── -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Overview</h1>
        <p id="view-sub" class="view-sub"></p>
      </div>
      <div class="topbar-actions">
        <span id="update-host"></span>
        <button class="btn ghost" id="refresh-btn" title="Reload state">
          <svg class="ico" viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08a6 6 0 1 1-1.41-6.24L13 11h7V4l-2.35 2.35z"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <section class="content" id="content"><!-- views render here --></section>
  </main>
</div>

<!-- ─────────────── Modal host ─────────────── -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="modal-x" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- ─────────────── Toast host ─────────────── -->
<div class="toast-host" id="toast-host"></div>

<script src="/static/app.js"></script>
</body>
</html>
